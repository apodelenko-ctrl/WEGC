# Dedicated, previously unused hostname; leave the public apex DNS unchanged.
# Build assets with: python3 scripts/mira-build-pilot-assets.py
# Copy to local ignored wrangler.toml and supply verified account/DB/Access IDs.
name = "mira-pilot-api"
main = "site-worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "pilot.wegc.fund", custom_domain = true }]

[assets]
directory = "./pilot-assets"
binding = "MIRA_ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
APP_ORIGIN = "https://pilot.wegc.fund"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUDIENCE = ""
APPLICATIONS_ENABLED = "false"
MATERIALS_ENABLED = "false"
APPLICATION_RATE_LIMIT = "5"
PRIVACY_VERSION = ""
PRIVACY_NOTICE_URL = ""

[[d1_databases]]
binding = "MIRA_DB"
database_name = "mira-pilot"
database_id = "REPLACE_WITH_VERIFIED_MIRA_DATABASE_ID"
migrations_dir = "migrations"
