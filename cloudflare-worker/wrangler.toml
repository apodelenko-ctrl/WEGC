name = "wegc-form-relay"
main = "wegc-form-relay.js"
compatibility_date = "2025-01-01"

# Secrets (do NOT put real values here — set them with `wrangler secret put`):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#
# Optional non-secret override:
[vars]
ALLOWED_ORIGINS = "https://wegc.fund,https://www.wegc.fund"

# Shared lead log (same D1 as the AI agent) so form enquiries land in /admin too.
[[d1_databases]]
binding = "DB"
database_name = "wegc-leads"
database_id = "12fb5c3a-54e8-46d4-ac10-cab2b7fbdc8a"
