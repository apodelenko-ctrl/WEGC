name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install static document and vector dependencies
        run: python -m pip install 'reportlab>=4,<5' 'python-docx>=1,<2' 'qrcode[pil]>=8,<9' 'cairosvg>=2,<3'
      - name: Build sanitized MIRA public files
        run: |
          python scripts/mira-wire-landing.py
          python scripts/mira-build-demo.py
          python scripts/mira-build-documents.py --downloads
          python scripts/mira-build-catalog.py
          python scripts/mira-build-launch.py
          python scripts/mira-build-expo.py
          python scripts/mira-build-campaign.py
          python scripts/mira-build-exhibition.py --downloads
      - name: Prepare clean static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude '.netlify' \
            --exclude 'node_modules' \
            --exclude '_site' \
            --exclude '_mira_site' \
            --exclude 'project-bible' \
            --exclude 'CLOUD-INBOX' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'cloudflare-worker/mira' \
            --exclude 'openai.chatgpt-0.5.53-universal.vsix'
          test ! -e _site/project-bible
          test ! -e _site/CLOUD-INBOX
          test -f _site/mira/marketplace.html
          test -f _site/mira/pilot.html
          test -f _site/mira/data/catalog.json
          test -f _site/mira/catalog/data.json
          test -f _site/mira/documents/agency-agreement.html
          test -f _site/mira/documents/downloads/agency-agreement.pdf
          test -f _site/mira/start/index.html
          test -f _site/mira/phuket/index.html
          test -f _site/mira/expo/banner.pdf
          test -f _site/mira/go/index.html
          test -f _site/mira/practical/index.html
          test -f _site/mira/corporate/index.html
          test -f _site/mira/exhibition/banner-rollup.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
