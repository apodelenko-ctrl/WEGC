name: MIRA onboarding readiness checks
on:
  push:
    branches: [mira/cloud-onboarding-20260917]
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker/mira/**'
      - 'scripts/mira-*.py'
      - 'tests/*mira*'
      - '.github/workflows/mira-onboarding-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing offline builder dependencies
        run: python -m pip install 'reportlab>=4,<5' 'python-docx>=1,<2' 'qrcode[pil]>=8,<9' 'cairosvg>=2,<3'
      - name: Test full repository without external identities or databases
        run: |
          mkdir -p /tmp/mira-readiness
          node --test tests/mira-*.test.mjs > /tmp/mira-readiness/node.tap
          python -m unittest discover -s tests -p 'test_mira*.py' -v > /tmp/mira-readiness/python.txt 2>&1
          python scripts/mira-build-pilot-assets.py > /tmp/mira-readiness/assets.txt
          git rev-parse HEAD > /tmp/mira-readiness/source.txt
      - name: Preserve reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-onboarding-readiness
          path: /tmp/mira-readiness/
          retention-days: 14
