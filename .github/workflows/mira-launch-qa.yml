name: MIRA launch evidence and QA
on:
  push:
    branches: [main]
    paths:
      - 'mira/**'
      - 'cloudflare-worker/mira/**'
      - 'scripts/mira-*.py'
      - 'tests/*mira*'
      - 'project-bible/mira/data/**'
      - 'project-bible/mira/sales/**'
      - 'project-bible/mira/operations/**'
      - 'ru/wegc-catalog-data.js'
      - '.github/workflows/mira-launch-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mira-launch-registers
  cancel-in-progress: false
jobs:
  validate-and-save:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply reviewed hash-pinned source checkpoint when present
        run: |
          python scripts/mira-repair-cp04.py
          python scripts/mira-apply-reviewed-checkpoint.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain, API and normalization regression tests
        run: |
          node --test tests/mira-*.test.mjs
          python -m unittest discover -s tests -p 'test_mira*.py' -v
      - name: Build from actual repository sources
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python scripts/mira-wire-landing.py
          python scripts/mira-build-demo.py
          python scripts/mira-launch-build.py
          node --test tests/mira-*.test.mjs
          python -m unittest discover -s tests -p 'test_mira*.py' -v
      - name: Save bounded generated checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mira/index.html mira/data/catalog.json \
            project-bible/mira/data/phuket-project-master.csv \
            project-bible/mira/sales/russia-launch-100-quality.csv \
            project-bible/mira/sales/russia-review-join-exceptions.csv \
            project-bible/mira/sales/phuket-developer-stage-register.csv \
            project-bible/mira/operations/launch-dashboard.json \
            project-bible/mira/operations/launch-dashboard.html \
            project-bible/mira/operations/LAUNCH-DASHBOARD.md \
            project-bible/mira/operations/launch-build-manifest.json \
            project-bible/mira/WORK-STATUS.md project-bible/mira/RESUME-STATE.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(mira): save reviewed source and launch registers [skip ci]'
            git push origin HEAD:main
          fi
      - name: Preserve QA output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mira-launch-evidence
          path: |
            project-bible/mira/operations/launch-dashboard.json
            project-bible/mira/operations/LAUNCH-DASHBOARD.md
            project-bible/mira/operations/launch-build-manifest.json
            project-bible/mira/data/phuket-project-master.csv
            project-bible/mira/sales/russia-launch-100-quality.csv
          retention-days: 14
      - name: Record exact recovery provenance
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          pathlib.Path('mira-recovery-manifest.json').write_text(json.dumps({
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'snapshot_head_sha': git('rev-parse', 'HEAD'),
              'working_tree': git('status', '--porcelain'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'scope': 'public repository MIRA source files only; not a database or private evidence backup',
              'outreach_authorized': False
          }, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Preserve bounded execution sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-execution-source
          path: |
            mira-recovery-manifest.json
            mira/
            cloudflare-worker/mira/
            scripts/mira-*.py
            tests/*mira*
            project-bible/mira/
            ru/wegc-catalog-data.js
          retention-days: 14
          if-no-files-found: error
