name: Phuket new-launch digest

on:
  schedule:
    - cron: "0 1 * * 1" # 08:00 Asia/Bangkok (01:00 UTC) — weekly, Mondays
  workflow_dispatch: {} # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: phuket-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: tg-digest
        run: npm install --no-audit --no-fund

      - name: Collect & send digest
        working-directory: tg-digest
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: npm run collect

      - name: Persist state (last-seen message ids)
        run: |
          if [ -n "$(git status --porcelain tg-digest/.state.json)" ]; then
            git config user.name "phuket-digest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tg-digest/.state.json
            git commit -m "chore(digest): update last-seen state [skip ci]"
            git push
          else
            echo "No state change."
          fi
