[build]
  command = "python -m pip install 'reportlab>=4,<5' 'python-docx>=1,<2' 'qrcode[pil]>=8,<9' 'cairosvg>=2,<3' && python scripts/mira-netlify-build.py"
  publish = "_mira_site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/mira/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
